# =====================================================================
#  DECISION SPECIFICATION  -  geopolitical
#  DISTINCT SIGNATURE: Persistent and contagion-prone; spreads through regional concentration. HIGH bar lowered to 0.55.
# =====================================================================

disruption_type: geopolitical

# RISK BANDS — lowered from 0.60 (persistent / contagion-prone type)
risk_bands:
  HIGH:   ">=0.55"
  MEDIUM: "0.45-0.54"
  LOW:    "<0.45"

sub_score_bands:
  high: ">=0.66"
  med:  "0.33-0.65"
  low:  "<0.33"

strategic_priority_cell: "Continuity Protection"
strategic_priority_note: "Geopolitical disruptions persist -> favour redundancy / dual-sourcing over short-term efficiency."

levers:
  permitted_response:
    - activate_pre_qualified_alternate
    - intensify_threat_monitoring
    - scenario_lever_generation
    - strategic_buffer_drawdown
    - convene_crisis_response_center
    - reroute_logistics
    - expedited_emergent_design
  prohibited_at_response:
    - reshoring_nearshoring
    - footprint_redesign
    - new_in_sourcing
    - ground_up_redesign
    - contract_renegotiation

escalation_ladder:
  levels:
    - { name: "Responsible Analyst", rank: 0, authority: responsible_analyst }
    - { name: "Cross-functional Management", rank: 1, authority: cross_functional_management }
    - { name: "Executive Leadership", rank: 2, authority: executive_leadership }

# =====================================================================
#  BENCHMARK EVALUATION DESIGN
# =====================================================================

evaluation_design:
  threshold_probe_values:
    LOW_EDGE: 0.449
    MEDIUM_LOWER_EDGE: 0.450
    MEDIUM_UPPER_EDGE: 0.549
    HIGH_EDGE: 0.550
  contrast_pairs:
    - pair_id: GEO_R3_vs_GEO_MED
      focal_rule: GEO-R3
      contrast_rule: GEO-MED
      vary_only: [shared_subtier_source, count_disrupted_paths]
      purpose: "Tests whether shared sub-tier convergence override is applied instead of generic medium-risk monitoring."
    - pair_id: GEO_R1_vs_GEO_R2
      focal_rule: GEO-R1
      contrast_rule: GEO-R2
      vary_only: [tier1_in_region]
      purpose: "In-region location discriminates replace (GEO-R1) from monitor (GEO-R2) for HIGH-risk suppliers."
    - pair_id: GEO_DT_vs_GEO_DT_NULL
      focal_rule: GEO-DT
      contrast_rule: GEO-DT-NULL
      vary_only: [shared_subtier_source, count_disrupted_paths]
      purpose: "Tests whether structural lower-tier concern is distinguished from harmless deep-tier exposure."
    - pair_id: GEO_MEDS_vs_GEO_MED
      focal_rule: GEO-MEDS
      contrast_rule: GEO-MED
      vary_only: [tier1_in_region]
      purpose: "In-region location (struck) triggers proactive contingency (Cross-functional Management) vs generic monitoring (Responsible Analyst) for MEDIUM-risk suppliers."
    - pair_id: GEO_LOWS_vs_GEO_LOW
      focal_rule: GEO-LOWS
      contrast_rule: GEO-LOW
      vary_only: [tier1_in_region]
      purpose: "In-region location (struck) triggers monitoring vs maintain for LOW-risk suppliers."

# =====================================================================
#  DECISION RULES
# =====================================================================

# --- PASS 1: scenario-level routing rules (first-match) ---------------
routing_rules:
  - rule_id: GEO-NULL
    when: "path_on_network == false OR (all Tier-1 LOW AND sub_downstream_criticality not high)"
    consequence:
      route: maintain_and_log
      disposition: maintain
      escalation: "Responsible Analyst"
    evaluation:
      clusters: [C1_PASS_STRUCTURE, C2_DEEP_TIER, C9_ACTION_ESCALATION_EXACTNESS]
      reference_expectations:
        band: not_applicable
        escalation: required
        action: not_applicable
        strategic_priority: optional

  - rule_id: GEO-DT
    when: "tier1_on_disrupted_path == false AND (shared_subtier_source == true OR count_disrupted_paths >= 2)"
    consequence:
      route: structural_fallthrough
      disposition: monitor
      escalation: "Cross-functional Management"
    note: "No Tier-1 scored - do NOT default to maintain. Branch on structure + material."
    evaluation:
      clusters: [C1_PASS_STRUCTURE, C2_DEEP_TIER, C9_ACTION_ESCALATION_EXACTNESS]
      reference_expectations:
        band: not_applicable
        escalation: required
        action: not_applicable
        strategic_priority: optional
      contrast_with: [GEO-DT-NULL]

  - rule_id: GEO-DT-NULL
    when: "tier1_on_disrupted_path == false AND NOT (shared_subtier_source == true OR count_disrupted_paths >= 2)"
    consequence:
      route: maintain_and_log
      disposition: maintain
      escalation: "Responsible Analyst"
    evaluation:
      clusters: [C1_PASS_STRUCTURE, C2_DEEP_TIER, C9_ACTION_ESCALATION_EXACTNESS]
      reference_expectations:
        band: not_applicable
        escalation: required
        action: not_applicable
        strategic_priority: optional
      contrast_with: [GEO-DT]

# --- PASS 2: per-Tier-1 supplier rules (ordered first-match) ----------
supplier_rules:

  - rule_id: GEO-R3                                 # THE DISCRIMINATOR
    priority: 1
    when_all:
      shared_subtier_source: true
      count_disrupted_paths: ">=2"
      risk_level: [MEDIUM, HIGH]
    consequence:
      disposition: replace
      permitted: [activate_pre_qualified_alternate, intensify_threat_monitoring, scenario_lever_generation]
      escalation: "Executive Leadership"
    note: >
      Per-supplier reading says 'monitor several MEDIUMs'. The shared sub-tier
      convergence means the apparent redundancy is illusory - one point of failure.
    evaluation:
      clusters:
        - C3_PRIORITY_OVERRIDE
        - C4_SCENARIO_SUPPLIER_JOIN
        - C8_FALLBACK_DISCIPLINE
        - C9_ACTION_ESCALATION_EXACTNESS
        - C10_STRATEGIC_POSTURE
        - C12_CROSS_POLICY_CONTAMINATION
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional
      contrast_with: [GEO-R1, GEO-MED]

  - rule_id: GEO-R1                                 # directly exposed high-risk
    priority: 2
    when_all:
      risk_level: HIGH
      tier1_in_region: true
    consequence:
      disposition: replace
      permitted: [activate_pre_qualified_alternate, intensify_threat_monitoring]
      escalation: "Executive Leadership"
    evaluation:
      clusters:
        - C5_TYPE_SPECIFICITY
        - C6_THRESHOLD_BANDING
        - C9_ACTION_ESCALATION_EXACTNESS
        - C10_STRATEGIC_POSTURE
        - C12_CROSS_POLICY_CONTAMINATION
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional
      contrast_with: [GEO-R2]

  - rule_id: GEO-R2                                 # high-risk, not regionally exposed
    priority: 3
    when_all:
      risk_level: HIGH
      tier1_in_region: false
    consequence:
      disposition: monitor
      permitted: [intensify_threat_monitoring, scenario_lever_generation]
      escalation: "Cross-functional Management"
    evaluation:
      clusters:
        - C5_TYPE_SPECIFICITY
        - C6_THRESHOLD_BANDING
        - C9_ACTION_ESCALATION_EXACTNESS
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional
      contrast_with: [GEO-R1]

  - rule_id: GEO-MEDS                              # MEDIUM + in-region (struck) -> proactive
    priority: 4
    when_all:
      risk_level: MEDIUM
      tier1_in_region: true
    consequence:
      disposition: monitor
      permitted: [activate_pre_qualified_alternate, intensify_threat_monitoring]
      escalation: "Cross-functional Management"
    grounding: "High ripple potential -> proactive contingency even at MEDIUM (Tomlin 2006)."
    evaluation:
      clusters:
        - C8_FALLBACK_DISCIPLINE
        - C9_ACTION_ESCALATION_EXACTNESS
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional
      contrast_with: [GEO-MED, GEO-R1]

  - rule_id: GEO-MED                               # MEDIUM, not structurally strategic
    priority: 5
    when_all:
      risk_level: MEDIUM
    consequence:
      disposition: monitor
      permitted: [intensify_threat_monitoring]
      escalation: "Responsible Analyst"
    evaluation:
      clusters:
        - C8_FALLBACK_DISCIPLINE
        - C9_ACTION_ESCALATION_EXACTNESS
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional

  - rule_id: GEO-LOWS                              # LOW + in-region (struck) -> keep watch
    priority: 6
    when_all:
      risk_level: LOW
      tier1_in_region: true
    consequence:
      disposition: monitor
      permitted: [intensify_threat_monitoring]
      escalation: "Responsible Analyst"
    grounding: "Watch structurally vital nodes even at LOW own-risk (Ivanov & Dolgui 2020)."
    evaluation:
      clusters:
        - C8_FALLBACK_DISCIPLINE
        - C9_ACTION_ESCALATION_EXACTNESS
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional
      contrast_with: [GEO-LOW, GEO-MED]

  - rule_id: GEO-LOW                               # routine catch-all (completeness)
    priority: 7
    when_all:
      risk_level: LOW
    consequence:
      disposition: maintain
      permitted: [intensify_threat_monitoring]
      escalation: "Responsible Analyst"
    evaluation:
      clusters:
        - C8_FALLBACK_DISCIPLINE
        - C9_ACTION_ESCALATION_EXACTNESS
      reference_expectations:
        band: required
        escalation: required
        action: required
        strategic_priority: optional

# =====================================================================
#  EXEMPLARS
# =====================================================================
exemplars:
  - exemplar_id: EX-GEO-03
    rule_ref: GEO-R3
    scenario:
      disruption_type: geopolitical
      tier1_suppliers: "three suppliers of a platinum-group metal, each MEDIUM (0.47-0.52)"
      tier1_in_region: false
      shared_subtier_source: true
      count_disrupted_paths: 3
    reasoning: >
      A per-supplier read suggests monitoring three moderate suppliers. The shared
      sub-tier check shows all three paths converge on a single refiner inside the
      disrupted region - the redundancy is illusory; one concentrated point of failure.
    key:
      disposition: replace
      escalation: "Executive Leadership"
      strategic_priority_cell: "Continuity Protection"

  - exemplar_id: EX-GEO-DT
    rule_ref: GEO-DT
    scenario:
      disruption_type: geopolitical
      tier1_on_disrupted_path: false
      max_disrupted_tier: 3
      count_disrupted_paths: 2
    key:
      disposition: monitor
      escalation: "Cross-functional Management"
      strategic_priority_cell: "Continuity Protection"
